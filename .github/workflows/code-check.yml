name: Code Quality Check

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Check runtime compatibility every Monday at 04:17 UTC.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Keep existing coverage and follow the latest stable runtime.
        node: ['18', '20', '22', '24', 'current']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Install and exercise the packaged client
        run: npm run test:package
